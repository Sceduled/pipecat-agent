[build]
# Use the Dockerfile we wrote
builder = "dockerfile"
dockerfilePath = "Dockerfile"

[deploy]
# Railway auto-injects $PORT — uvicorn reads it at startup
startCommand = "sh -c 'uv run uvicorn main:app --app-dir /app/examples/real_estate_agent --host 0.0.0.0 --port ${PORT:-8080}'"

# Keep one instance always warm (cold starts kill voice latency)
numReplicas = 1

# Health check so Railway knows the container is alive
healthcheckPath = "/health"
healthcheckTimeout = 30

# Restart policy
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
